name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, ETL, testes e gabaritos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: A base versionada é a que o gerador produz
        run: |
          python -m pergunte_comex.gerar_base
          git diff --exit-code dados/processos_comex.csv
      - name: ETL com validações
        run: python -m pergunte_comex.etl
      - name: Testes
        run: pytest -q
      - name: Gabaritos da avaliação
        run: python -m avaliacao.avaliar --gabarito
      - name: Modo demonstração, sem chave de IA
        run: |
          rm -f dados/comex.duckdb
          pergunte-comex --demo "atraso médio por modal"

  avaliacao-ia:
    name: Avaliação da IA
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Conferir se a chave da API está configurada
        id: chave
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secret ANTHROPIC_API_KEY ausente: avaliação da IA pulada." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.chave.outputs.disponivel == 'true'
      - uses: actions/setup-python@v5
        if: steps.chave.outputs.disponivel == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        if: steps.chave.outputs.disponivel == 'true'
        run: pip install -e .
      - name: ETL
        if: steps.chave.outputs.disponivel == 'true'
        run: python -m pergunte_comex.etl
      - name: Avaliar a IA nas perguntas de teste
        if: steps.chave.outputs.disponivel == 'true'
        run: python -m avaliacao.avaliar --ia
      - name: Publicar o relatório no resumo do workflow
        if: always() && steps.chave.outputs.disponivel == 'true'
        run: cat saida/avaliacao.md >> "$GITHUB_STEP_SUMMARY"
